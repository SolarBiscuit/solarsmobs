modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SolarBiscuit/solarsmobs"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Find unique mobs of all kinds in the overworld
'''
logoFile="icon.png"
displayTest = "IGNORE_ALL_VERSION"

# Sets the required Forge version
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

# Sets the required Minecraft version
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional Curios — necklace slot/item tags activate when present
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5.4,)"
    ordering="NONE"
    side="BOTH"

# Optional Simple Hats — common hat bags drop from this mod's mobs when present
[[dependencies.${mod_id}]]
    modId="simplehats"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Optional Simply Swords — Templars can spawn with iron longswords and rapiers
[[dependencies.${mod_id}]]
    modId="simplyswords"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Optional EMI — Holy Cross info page
[[dependencies.${mod_id}]]
    modId="emi"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="CLIENT"

# Optional Voidscape — End Warriors can spawn in its biomes
[[dependencies.${mod_id}]]
    modId="voidscape"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Optional Enderman Overhaul — Sacred Ender Ring also calms its Endermen
[[dependencies.${mod_id}]]
    modId="endermanoverhaul"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Optional Supplementaries — Archers can drop a quiver
[[dependencies.${mod_id}]]
    modId="supplementaries"
    mandatory=false
    versionRange="[0,)"
    ordering="NONE"
    side="BOTH"

# Optional Sophisticated Core / Storage — tamed Femboy internal chest uses SS GUI when present
[[dependencies.${mod_id}]]
    modId="sophisticatedcore"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="sophisticatedstorage"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Optional Sophisticated Backpacks — tamed Femboy Curios back slot
[[dependencies.${mod_id}]]
    modId="sophisticatedbackpacks"
    mandatory=false
    versionRange="[0,)"
    ordering="AFTER"
    side="BOTH"

# Optional Jade — Femboy chest and Templar hire timer on the overlay
[[dependencies.${mod_id}]]
    modId="jade"
    mandatory=false
    versionRange="[11.0,)"
    ordering="AFTER"
    side="BOTH"