modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/SolarBiscuit/solarsmobs"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Find unique mobs of all kinds in the overworld
'''
logoFile="icon.png"
displayTest = "IGNORE_ALL_VERSION"

# Sets the required Forge version
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

# Sets the required Minecraft version
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Optional Curios — necklace slot/item tags activate when present
[[dependencies.${mod_id}]]
    modId="curios"
    mandatory=false
    versionRange="[5.4,)"
    ordering="NONE"
    side="BOTH"